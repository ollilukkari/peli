name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.site.outputs.ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare public game files
        id: site
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess

          if not Path('index.html').is_file():
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ready=false\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Publication skipped: index.html is not on main yet.\n')
              raise SystemExit(0)

          Path('_site').mkdir()
          public_dirs = {'assets', 'icons', 'audio', 'css', 'js', 'src'}
          public_extensions = {
              '.html', '.css', '.js', '.mjs', '.webmanifest',
              '.svg', '.png', '.jpg', '.jpeg', '.webp', '.gif', '.ico',
              '.mp3', '.ogg', '.wav', '.woff', '.woff2',
          }
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, tracked):
              source = Path(name)
              if any(part.startswith('.') for part in source.parts):
                  continue
              in_public_dir = source.parts[0] in public_dirs
              if len(source.parts) > 1 and not in_public_dir:
                  continue
              allowed = source.suffix.lower() in public_extensions
              allowed = allowed or name == 'manifest.json'
              allowed = allowed or (in_public_dir and source.suffix.lower() == '.json')
              if not allowed:
                  continue
              if source.is_symlink() or any(parent.is_symlink() for parent in source.parents):
                  raise SystemExit(f'Symbolic links are not publishable: {name}')
              destination = Path('_site') / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)

          if not Path('_site/index.html').is_file():
              raise SystemExit('index.html must be tracked in Git before publication.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=true\n')

      - name: Upload game files
        if: steps.site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
